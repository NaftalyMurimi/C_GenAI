<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Website</title>
  <link rel="stylesheet" href="styles.css">
  
<style>
    /* styles.css */



.welcome-section {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  background-color: #f7f7f7;
}

.image-section img {
  width: 300px;
  height: auto;
  border-radius: 10px;
}

.text-section {
  max-width: 500px;
  margin-left: 30px;
}

.text-section h1 {
  font-size: 36px;
  color: #004aad;
}

.text-section p {
  font-size: 18px;
  color: #555;
  margin: 20px 0;
}

.learn-more-btn {
  display: inline-block;
  padding: 10px 20px;
  background-color: #004aad;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}

.learn-more-btn:hover {
  background-color: #003580;
}


</style>

  
</head>
<body>


  <main class="welcome-section">
    <div class="image-section">
      <img src="unnamed.jpg" alt="Students in front of the school">
    </div>
    <div class="text-section">
      <h1>Welcome to SchoolName</h1>
      <p>
        At SchoolName, we are committed to fostering a nurturing environment where students
        excel academically and grow personally. Join us in shaping the leaders of tomorrow.
      </p>
      <a href="#" class="learn-more-btn">Learn More</a>
    </div>
  </main>

</body>
</html>

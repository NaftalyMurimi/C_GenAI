<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion with Sub-Accordions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Accordion with Sub-Accordions</h2>

    <div class="accordion" id="mainAccordion">

        <!-- First Accordion -->
        {% if courses %}
            {% for course in courses %}
                {% for topic in course.topics.all %}

        <div class="accordion-item">
            <h2 class="accordion-header" id="headingOne">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                    {{ topic.name }}
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#mainAccordion">
                <div class="accordion-body">
                    <div class="accordion" id="subAccordionOne">
                        <!-- Sub-Accordion 1 -->
                        {% if topic.subtopics.all %}
                        {% for subtopic in topic.subtopics.all %}
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="subHeadingOneOne">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#subCollapseOneOne" aria-expanded="false" aria-controls="subCollapseOneOne">
                                    {{ subtopic.name }}
                                </button>
                            </h2>
                            <div id="subCollapseOneOne" class="accordion-collapse collapse" aria-labelledby="subHeadingOneOne" data-bs-parent="#subAccordionOne">
                                <div class="accordion-body">
                                    {{ subtopic.description }}
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                        {% endif %}
                     
                    </div>
                </div>
            </div>
        </div>
                {% endfor %}
            {% endfor %}
        {% endif %}

       

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
